<div class="aisuite-formcontrol">
  <div class="input-group" [formGroup]="aiForm">
    <input type="hidden" formControlName="unicId" />
    <input type="text" class="form-control" [class.form-control-sm]="small" autocomplete="off"
      formControlName="name" [placeholder]="placeholder"
      (keyup)="onKey($event)" (focus)="show()" (blur)="update()" />
      <button class="btn btn-sm btn-outline-secondary aisuite-leaf" type="button" role="button"
        (click)="show()" [disabled]="disabled">
        <i class="fas fa-leaf"></i>
      </button>
    </div>
    <div class="aisuite-control-list" (mouseleave)="hide()" [style.max-height]="mxheigth"
      tabindex="-1" [ngClass]="{'in': visibleAnimate}"
      [ngStyle]="{'display': visible ? 'block' : 'none', 'opacity': visibleAnimate ? 1 : 0 }">
      @if (showpresel) {
        <div class="list-group">
          @for (itm of presetList; track itm) {
            <button [class]="gpClass(itm)" type="button" role="button"
            (click)="userpush(itm)" [innerHTML]="itm.html"></button>
          }
        </div>
      }
      @if (showpresel) {
        <div class="dropdown-divider"></div>
      }
      <div class="list-group">
        @for (itm of filteredlist; track itm) {
          <button [class]="gpClass(itm)"
          type="button" role="button" (click)="userpush(itm)" [innerHTML]="itm.html"></button>
        }
      </div>
    </div>
  </div>
